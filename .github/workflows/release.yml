name: "🚀 Professional CI/CD Release"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # IMPORTANT: Gets all history so we can see the commits

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🛠️ Build Library
        run: npm run build:lib

      - name: 📦 Create NPM Package Asset (.tgz)
        run: npm pack

      # NEW: This step builds the changelog by looking at your commit prefixes
      - name: 📝 Build Categorized Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configuration: ".github/changelog_config.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Use the changelog generated in the step above
          body: |
            ## 🌟 Official Release ${{ github.ref_name }}
            
            This version was automatically built and published by **ZED Studios** CI/CD pipeline.
            
            ${{ steps.build_changelog.outputs.changelog }}
            
            ---
            **Maintained by [Youssef Zidan](https://yzportfolio.vercel.app)**
          files: |
            *.tgz
          generate_release_notes: false # We are using our own builder now
          name: "ZProximity Engine ${{ github.ref_name }} ⚡"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Publish to NPM
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}