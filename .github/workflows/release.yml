name: "🚀 Auto Release"

on:
  push:
    tags:
      - "v*" 

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: "ZProximity Engine ${{ github.ref_name }} ⚡"
          body: |
            ### 🌟 New Update from ZED Studios
            This version was automatically deployed and documented.
            
            **Maintainer:** [Youssef Zidan](https://yzportfolio.vercel.app)
          draft: false
          prerelease: false