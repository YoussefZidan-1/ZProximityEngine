name: "🚀 Professional CI/CD Release"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🛠️ Build Library
        run: npm run build:lib

      - name: 📦 Create NPM Package Asset (.tgz)
        run: npm pack

      - name: 📝 Auto-Generate Smart Release Notes & GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true 
          files: |
            *.tgz
          name: "ZProximity Engine ${{ github.ref_name }} ⚡"
          body: |
            ## 🌟 Official Release ${{ github.ref_name }}
            
            This version was automatically built and published by **ZED Studios** CI/CD pipeline.
            
            ---
            **Maintained by [Youssef Zidan](https://yzportfolio.vercel.app)**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Publish to NPM (via Trusted Publisher)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}